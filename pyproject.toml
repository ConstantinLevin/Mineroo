[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mineru-ocr"
version = "0.1.0"
description = "Lokale Seite der MinerU-OCR-Strecke: Dokumente rein, Text und Struktur raus — ueber Postgres und Procrastinate."
requires-python = ">=3.12"

# Die Fassungen sind die am 07.08.2026 in der Miniconda-Base vorhandenen und
# damit die einzigen, gegen die je etwas gelaufen ist. Untergrenzen statt
# Pins, weil die Base geteilt ist und ein Pin dort andere Projekte brechen
# wuerde; Obergrenzen bewusst keine, aber siehe den Kommentar an procrastinate.
dependencies = [
    # 3.10.0 ist die Fassung, gegen die die Tests laufen. Die 19 Feature-Belege
    # in plans/2026-08-06-procrastinate-feature-verifikation.md sind gegen 3.9.0
    # geprueft (zwei davon am Objekt: SQL-Schema und Quellcode) und fuer 3.10.0
    # im Nachtrag am Ende jener Datei durchgegangen. Bei einem Upgrade gehoert
    # diese Datei erneut durchgegangen, besonders Punkt 12 (undokumentierte
    # Heartbeat-Tabelle) und Punkt 19 (retry_job_by_id).
    "procrastinate>=3.10.0",
    "psycopg[binary,pool]>=3.3.3",
    "httpx>=0.28.1",
    # pypdfium2 schneidet PDFs ohne Aufblaehen (gemessen 1,00x am 17-MB-
    # Fixture-Bescheid). pypdf ist im ganzen Projekt VERBOTEN (Betriebshandbuch:
    # 360 MB Quelle wurden zu 4,1 GB Einzelseiten) und taucht deshalb hier nicht
    # als Abhaengigkeit auf, auch nicht mittelbar gewollt.
    "pypdfium2>=4.30.0",
    # Pillow fragt nach dem zweiten Bild einer Bilddatei (images.py, das einzige Modul, das
    # es importiert): Mehr als eines endet im Job als input_error mit dem Hinweis,
    # als PDF einzureichen. 12.2.0 ist die Fassung der Miniconda-Base, gegen die
    # die Tests laufen; ein Pin wuerde dort andere Projekte brechen.
    "pillow>=12.2.0",
    # typer bringt rich als eigene Abhaengigkeit mit. Eine zusaetzliche eigene
    # Zeile dafuer stand hier und war eine Behauptung, die nicht stimmte: Das
    # Paket benutzt rich nirgends. Sie ist weg — wer spaeter rich benutzt, traegt
    # es wieder ein, und dann stimmt es auch.
    "typer>=0.19.2",
    # click bringt typer mit; die Kommandozeile importiert es selbst fuer
    # `click.Choice`, damit die Auswahl von `--tier` und `--ocr-mode` aus den
    # Listen in config stammt und nicht ein zweites Mal getippt wird. 8.3.1 ist
    # die Fassung der Miniconda-Base.
    "click>=8.3.1",
    # packaging vergleicht MinerU-Versionen nach PEP 440 (executor: die
    # niedrigste der Teilstuecke kommt an die Zeile, Mineroo#14). 24.2 ist die
    # Fassung der Miniconda-Base.
    "packaging>=24.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "mypy>=1.19.1",
]

[project.scripts]
# Der zweite Zugangsweg. Der erste ist `import mineru_ocr`; beide fuehren auf
# dieselbe oeffentliche Flaeche, das Kommando enthaelt keine eigene Logik.
mineru-ocr = "mineru_ocr.cli:main"

[tool.setuptools]
packages = ["mineru_ocr"]

[tool.mypy]
python_version = "3.12"
# Die Contracts sind die Schnittstelle; sie muessen vollstaendig annotiert sein,
# sonst ist der Vertrag nur halb aufgeschrieben. Deshalb streng, und zwar ab
# Phase A — nicht erst, wenn Koerper drinstehen.
strict = true
warn_unreachable = true
# procrastinate, psycopg, httpx und typer liefern eigene Typangaben mit. Fehlen
# sie einem Paket, wird die Ausnahme hier einzeln und mit Begruendung
# eingetragen, nie global abgeschaltet — siehe direkt darunter.

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
# pypdfium2 4.30.0 bringt weder Typ-Stubs noch eine py.typed-Markierung mit
# (am installierten Paket festgestellt). Die Ausnahme gilt AUSSCHLIESSLICH fuer
# dieses eine Paket, und der Zugriff darauf ist ohnehin eingesperrt: mineru_ocr/
# pdf.py ist das einzige Modul, das pypdfium2 importiert. Bricht die Bibliothek
# eine Annahme, bricht genau eine Datei.
#
# `follow_untyped_imports` und nicht `ignore_missing_imports`: Das Paket IST
# installiert, es hat nur keine Typangaben — mypy meldet das als
# `import-untyped`, und dafuer ist diese Einstellung zustaendig. Mypy folgt dem
# Modul dann und behandelt seine Namen als unbestimmt, statt den Import ganz zu
# uebergehen; das ist das Genauere von beidem.
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["mineru_ocr.pdf", "test_pdf", "test_executor", "test_wrapper"]
# Und die Gegenseite: Aufrufe IN ein untypisiertes Modul hinein verbietet der
# strenge Modus ebenfalls. Die Ausnahme gilt genau fuer die Dateien, die
# pypdfium2 benutzen — nicht fuer das Paket. Alles andere in mineru_ocr und in
# tests bleibt streng geprueft, und wenn jemand pypdfium2 spaeter woanders
# importiert, meldet mypy es dort sofort.
#
# `test_pdf` ohne Praefix, weil tests/ kein `__init__.py` hat und mypy die Datei
# deshalb als Modul der obersten Ebene fuehrt. `tests.test_pdf` traefe ins Leere
# und die Ausnahme waere still wirkungslos — der Lauf ueber `mypy mineru_ocr
# tests` deckt genau das auf, ein Lauf nur ueber das Paket nicht.
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Phase A legt die Testnamen an (ein Test je Zusicherung, uebersprungen);
# Phase B fuellt die Koerper. Ein uebersprungener Test mit sprechendem Namen
# ist die ausfuehrbare Fassung des Vertrags.
markers = [
    "live: spricht mit dem echten RunPod-Endpoint und KOSTET GELD (Phase D, nur mit ausdruecklicher Zustimmung)",
    "db: braucht die laufende Postgres-Instanz auf Port 5437 (Phase C)",
]
